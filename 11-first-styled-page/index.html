<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11 First Style Page</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        body {

            background-color: #f0f0f0;

        main {

        }
        footer {

            color: white;
            text-align: center;
            padding: 15px;

</head>

        <nav>
            <ul>

                <li><a href="#">About</a></li>

    <main>
        <!-- Inline CSS demonstrated here -->
        <h1 class="welcome" style="color: #e74c3c; text-align: center;">Welcome To My Page</h1>
        
        <p>This is my first styled page using all three CSS methods.</p>
        
        <h2 class="explore">Explore</h2>
        
        <p id="tech">Technology</p>
        <p>Culture</p>

    <footer>
