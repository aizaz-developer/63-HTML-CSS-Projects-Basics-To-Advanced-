<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Style Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- header -->
     <header>
        <h1>Border Style Gallery</h1>
        <p>Playing with borders in CSS</p>
     </header>

     <!-- Main -->
      <main>
        <!-- Section 1 -->
         <section class="border-styles">
            <h2>Border Styles</h2>
            <div Class="style-box solid"><p>Solid</p></div>
            <div Class="style-box dashed"><p>Dashed</p></div>
            <div Class="style-box dotted"><p>Dotted</p></div>
            <div Class="style-box double"><p>Double</p></div>
            <div Class="style-box groove"><p>Groove</p></div>
            <div Class="style-box ridge"><p>Ridge</p></div>
            <div Class="style-box inset"><p>Inset</p></div>
            <div Class="style-box outset"><p>Outset</p></div>
        </section>

        <!-- Section 2 Border Radius -->
         <section  class="border-radius">
           <h2>Border Radius</h2>
           <div class="radius-box slight"><p>4px</p></div>
           <div class="radius-box medium"><p>16px</p></div>
           <div class="radius-box pill"><p>Pill</p></div>
           <div class="radius-box circle"><p>Circle</p></div>
         </section>
      </main>

      <footer>
        <p>Project 16 — CSS Borders</p>
      </footer>
</body>
</html>
